[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-photonics"
version = "0.1.0"
description = "Causal signal restoration with simulated photonic reservoir computing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
rc-photonics-baselines = "rc_photonics.experiments_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
