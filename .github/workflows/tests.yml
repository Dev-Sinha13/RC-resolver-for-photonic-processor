name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run benchmark entry point
        run: rc-photonics-baselines

      - name: Smoke-test reservoir package APIs
        run: >-
          python -c "from rc_photonics import EchoStateNetwork,
          PhotonicDelayReservoir, RidgeReadout; print('reservoir APIs import')"

      - name: Smoke-test optical link and equalizers
        run: rc-photonics-optical --quick --output results/optical-ci

  pytorch-backend:
    name: PyTorch backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with optional PyTorch support
        run: python -m pip install -e ".[torch]"

      - name: Run PyTorch backend tests
        run: python -m unittest tests.test_torch_esn -v
